:root {

.GeekyIllustration body {
	min-height: 100vh;

	&:has(>header.FixedHeader) {

	}
	& > header.FixedHeader {
		position : fixed;
		left : 0;
		right : 0;
		top : 0;
		height : 6em;
		display : flex;
		justify-content: flex-start;
		align-items: baseline;
		gap: 1em;
		padding : 0 6em;
		border-left: none;
		border-top: none;
		border-right: none;
	}
	& > main {
		margin : 0 auto;
		width: 100%;
		background-color: var(--PAGE-BACKGROUND);

		& > section:not(.MonoFigure) {
			margin : 1cm auto;
			position : relative;
			display : flex;
			flex-direction : column;
			justify-content: flex-start;
			justify-items: left;
			padding : var(--DOCUMENT-PAGE-MARGIN) var(--DOCUMENT-PAGE-MARGIN);
			width : calc(21cm - 4cm);
			height : calc(29.7cm - 4cm);

			/* border-radius: calc(var(--DOCUMENT-PAGE-MARGIN) / 4); */
		}
		& > section.FrontPage {
			justify-items: center;
			text-align : center;
		}
	}
	& figure {
		overflow: hidden;
	}
}



@media screen and (orientation : landscape) {
	.GeekyIllustration section.MonoFigure {
		height : 100%;
		max-width : 100%;
	}
}
@media screen and (orientation : portrait) {
	.GeekyIllustration section.MonoFigure {
		max-height : 100%;

.GeekyIllustration body {
	height : 100vh;
	& > main:has(>section.MonoFigure) {
		overflow: hidden;
	}
	& > main {
		border : none !important;
		height : 100%;
		width : 100%;
		
		& > section:not(.MonoFigure) {
			height : calc(100% - 4cm) !important;
			width : calc(100% - 4cm) !important;
			margin : auto !important;
		}
		& > section.MonoFigure {
			border : none;

			background : none !important;

			margin : auto;
			padding : 0;

			display : flex;
			flex-direction : row;
			justify-content: center;
			align-items: stretch;
			flex-wrap: wrap;
			gap : 1em;
			overflow-y: scroll;

				flex-grow: 1;

				aspect-ratio: 1 / 1;

					max-height : 100vh;
				}

			&:has(>:only-child) {
				flex-wrap: unset;

			max-height : calc(100vh - 6em);
		}
	}
}</style>
